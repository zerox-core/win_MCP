name: Windows Development CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Node tests
        shell: pwsh
        run: |
          # config.ts refuses to start under AUTH_MODE=pin without a PIN. Generate
          # it here rather than committing a literal: the secret scan reports any
          # committed value it finds, so a literal PIN in this file would be
          # flagged as a leak on every run.
          $env:AUTH_MODE = "pin"
          $env:AUTH_PIN = -join ((1..24) | ForEach-Object { '{0:x}' -f (Get-Random -Min 0 -Max 16) })
          npm test

      - name: Broker tests
        run: dotnet test broker/WinMcp.AdminBroker.Tests/WinMcp.AdminBroker.Tests.csproj

      - name: Python smoke tests
        shell: pwsh
        run: |
          # test/e2e_test.py drives the server over HTTP and needs the httpx client.
          python -m pip install --disable-pip-version-check --quiet httpx
          # Same reason as above: the harness boots the server itself, so it needs
          # a PIN, and it must not be a committed literal.
          $env:AUTH_MODE = "pin"
          $env:AUTH_PIN = -join ((1..24) | ForEach-Object { '{0:x}' -f (Get-Random -Min 0 -Max 16) })
          python test/e2e_test.py

      - name: Production audit
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Secret scan
        shell: pwsh
        run: |
          # Scan with freshly generated throwaway secrets instead of literal
          # fixtures. A literal would have to be committed for the scan to know
          # it, and committed in this very file — so the scan would then always
          # match its own input and report a "leak" that cannot be fixed.
          $env:AUTH_MODE = "none"
          $env:APPROVAL_STATE_SECRET = -join ((1..64) | ForEach-Object { '{0:x}' -f (Get-Random -Min 0 -Max 16) })
          $env:OWNER_USER_ID = "ci-owner"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/scan-development-secrets.ps1

      - name: Whitespace check
        run: git diff --check
